name: Verify BorrowCheck
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit, integration and independent-oracle tests
        run: python -m unittest discover -s tests -v
      - name: Ten synthetic acceptance packets
        run: python -m borrowcheck evaluate
      - name: Verify source syntax
        run: python -m compileall -q borrowcheck tools tests
